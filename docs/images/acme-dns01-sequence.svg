<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.actor{font:700 17px Arial,sans-serif;fill:#0f172a}.msg{font:14px Arial,sans-serif;fill:#334155}.life{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 6}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arr)}.box{fill:#f8fafc;stroke:#94a3b8}</style>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">ACME DNS-01 Issuance Sequence</text>
  <g>
    <rect x="70" y="75" width="180" height="52" rx="12" class="box"/><text x="160" y="107" text-anchor="middle" class="actor">acme.sh</text>
    <rect x="350" y="75" width="180" height="52" rx="12" class="box"/><text x="440" y="107" text-anchor="middle" class="actor">ACME Server</text>
    <rect x="650" y="75" width="180" height="52" rx="12" class="box"/><text x="740" y="107" text-anchor="middle" class="actor">Local DNS</text>
    <rect x="930" y="75" width="180" height="52" rx="12" class="box"/><text x="1020" y="107" text-anchor="middle" class="actor">Intermediate CA</text>
    <line x1="160" y1="127" x2="160" y2="850" class="life"/><line x1="440" y1="127" x2="440" y2="850" class="life"/><line x1="740" y1="127" x2="740" y2="850" class="life"/><line x1="1020" y1="127" x2="1020" y2="850" class="life"/>
  </g>
  <g class="arrow">
    <path d="M160 175 H440"/><path d="M440 235 H160"/><path d="M160 300 H740"/><path d="M160 365 H440"/>
    <path d="M440 430 H740"/><path d="M740 490 H440"/><path d="M440 550 H160"/><path d="M160 615 H440"/>
    <path d="M440 680 H1020"/><path d="M1020 740 H440"/><path d="M440 805 H160"/>
  </g>
  <g class="msg">
    <text x="275" y="166">1. newOrder(domain)</text>
    <text x="255" y="226">2. authz + dns-01 challenge</text>
    <text x="390" y="291">3. publish _acme-challenge TXT</text>
    <text x="255" y="356">4. trigger challenge</text>
    <text x="555" y="421">5. query TXT</text>
    <text x="565" y="481">6. TXT value</text>
    <text x="240" y="541">7. authorization = valid</text>
    <text x="245" y="606">8. finalize(CSR)</text>
    <text x="660" y="671">9. sign CSR public key</text>
    <text x="655" y="731">10. leaf certificate</text>
    <text x="245" y="796">11. download Leaf + Intermediate</text>
  </g>
  <rect x="335" y="835" width="530" height="42" rx="10" class="box"/>
  <text x="600" y="861" text-anchor="middle" class="msg">Private key never enters the ACME server; only the CSR public key is signed.</text>
</svg>